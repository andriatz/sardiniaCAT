<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Mistral</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; justify-content: center; background: #f5f5f4; color: #1c1917; }
    main { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
    h1 { font-size: 1.1rem; margin: 8px 0 0; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #ffffff; border: 1px solid #e7e5e4; border-radius: 12px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #ffedd5; }
    .assistant { align-self: flex-start; background: #e7e5e4; }
    .error { align-self: flex-start; background: #fee2e2; color: #991b1b; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #d6d3d1; border-radius: 10px; font-size: 1rem; }
    button { padding: 10px 16px; border: 0; border-radius: 10px; background: #ea580c; color: #ffffff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1917; color: #f5f5f4; }
      #messages { background: #292524; border-color: #44403c; }
      .assistant { background: #44403c; }
      .user { background: #7c2d12; }
      input { background: #292524; color: #f5f5f4; border-color: #57534e; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Chat Mistral &middot; <span id="model">&hellip;</span></h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Scrivi un messaggio&hellip;" />
      <button type="submit">Invia</button>
    </form>
  </main>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const history = [];

    function add(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      add("user", content);
      history.push({ role: "user", content });
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Errore sconosciuto");
        add("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        add("error", String(err.message || err));
      } finally {
        button.disabled = false;
        input.focus();
      }
    });

    fetch("/api/health")
      .then((r) => r.json())
      .then((h) => { document.getElementById("model").textContent = h.model; })
      .catch(() => {});
  </script>
</body>
</html>
